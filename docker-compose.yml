services:
  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbitmq-notification
    restart: unless-stopped
    ports:
      - "5672:5672"
      - "15672:15672"   # management UI (guest/guest)
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  mysql-notification:
    image: mysql:8
    container_name: mysql-notification
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: notification_db
    ports:
      - "3307:3306"
    volumes:
      - mysql-notification-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 5s
      timeout: 3s
      retries: 20

  notification:
    build: .
    container_name: notification-service
    restart: unless-stopped
    depends_on:
      mysql-notification:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    ports:
      - "8082:8082"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql-notification:3306/notification_db
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: root
      SPRING_RABBITMQ_HOST: rabbitmq
      # identity-service runs outside this compose (its own); reach it on the host
      APP_IDENTITY_BASE_URL: http://host.docker.internal:8080
      BREVO_API_KEY: ${BREVO_API_KEY:-}
      BREVO_FROM_EMAIL: ${BREVO_FROM_EMAIL:-no-reply@hospital.local}
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  mysql-notification-data:
