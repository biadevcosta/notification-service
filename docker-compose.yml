services:
  mysql-notification:
    image: mysql:8
    container_name: mysql-notification
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: notification_db
    ports:
      - "3307:3306"
    volumes:
      - mysql-notification-data:/var/lib/mysql

volumes:
  mysql-notification-data:
