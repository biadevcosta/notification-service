server:
  port: 8082

spring:
  application:
    name: notification
  datasource:
    url: jdbc:mysql://localhost:3307/notification_db
    username: root
    password: root
  flyway:
    locations: classpath:db/migration
  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest
    listener:
      simple:
        acknowledge-mode: auto
        default-requeue-rejected: false   # rejected -> DLQ, not back onto the queue
        retry:
          enabled: true
          max-attempts: 3
          initial-interval: 2s
  cache:
    cache-names: patient-contacts
    caffeine:
      spec: maximumSize=1000,expireAfterWrite=10m

# Custom properties consumed by infrastructure (bound with @ConfigurationProperties).
app:
  reminder:
    rabbit:
      exchange: appointment.reminders    # declared by scheduling-service
      queue: reminder.queue
      routing-key: appointment.reminder
      dlq: reminder.dlq
  identity:
    base-url: http://localhost:8080

management:
  endpoints:
    web:
      exposure:
        include: health,info
